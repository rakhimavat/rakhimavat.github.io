<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Promise Wall · Promises to Self</title>
  <style>
    .wall-page {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }
    .wall-header {
      text-align: center;
      margin-bottom: 52px;
    }
    .wall-header h1 {
      font-family: 'Special Elite', serif;
      font-size: 2.4rem;
      margin-bottom: 12px;
      color: #2c2c2c;
    }
    .wall-header p {
      font-size: 0.88rem;
      color: #888;
      letter-spacing: 0.04em;
      line-height: 1.6;
      max-width: 540px;
      margin: 0 auto;
    }
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'Courier Prime', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      padding: 8px 18px;
      border: 1px solid #d4cdc0;
      background: #fdfaf3;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: #aaa;
      color: #2c2c2c;
    }
    .filter-btn.active {
      background: #2c2c2c;
      color: #fdfaf3;
      border-color: #2c2c2c;
    }
    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
    }
    .wall-card {
      background: #fdfaf3;
      border: 1px solid #e0d9ce;
      padding: 36px 32px 28px 56px;
      position: relative;
      background-image: linear-gradient(
        #fdfaf3 0px, #fdfaf3 27px,
        #e0d9ce 27px, #e0d9ce 28px
      );
      background-size: 100% 28px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .wall-card:hover {
      transform: translateY(-3px);
      box-shadow: 4px 4px 0 #e0d9ce;
    }
    .wall-card::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 44px;
      width: 1px;
      background: #f0b0a8;
      opacity: 0.6;
    }
    .card-text {
      font-family: 'Courier Prime', monospace;
      font-size: 0.92rem;
      line-height: 28px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 64px;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e8e2d8;
      font-size: 0.7rem;
      color: #bbb;
      letter-spacing: 0.06em;
    }
    .card-ribbon {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.2);
    }
    .state-msg {
      text-align: center;
      padding: 80px 24px;
      font-size: 0.85rem;
      color: #bbb;
      letter-spacing: 0.06em;
      grid-column: 1 / -1;
    }
    .write-cta {
      text-align: center;
      margin-top: 52px;
      padding-top: 32px;
      border-top: 1px solid #e0d9ce;
    }
    .write-cta a {
      color: #888;
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #ddd;
      transition: color 0.2s;
    }
    .write-cta a:hover {
      color: #2c2c2c;
    }
    .promise-count {
      text-align: center;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .wall-grid {
        grid-template-columns: 1fr;
      }
      .wall-card {
        padding: 32px 24px 24px 48px;
      }
      .wall-card::before {
        left: 36px;
      }
    }
  </style>
</head>
<body>

<nav style="border-bottom:1px solid #e8e2d8;background:#f5f0e8;margin-bottom:0">
  <div style="max-width:780px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between">
    <a href="index.html" style="font-family:'Special Elite',serif;font-size:1.1rem;color:#2c2c2c;text-decoration:none">Promises to Self</a>
    <div style="font-size:.75rem;color:#aaa;letter-spacing:.08em">
      <a href="index.html" style="color:#888;text-decoration:none">write</a>
      &nbsp;·&nbsp;
      <a href="wall.html" style="color:#888;text-decoration:none">the wall</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div class="wall-page">
    <div class="wall-header">
      <h1>The Promise Wall</h1>
      <p>Promises people have made to themselves. Read them. Be inspired. Keep your own.</p>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">all promises</button>
      <button class="filter-btn" data-filter="health">health & wellness</button>
      <button class="filter-btn" data-filter="growth">growth & learning</button>
      <button class="filter-btn" data-filter="relationships">relationships</button>
      <button class="filter-btn" data-filter="career">career & work</button>
      <button class="filter-btn" data-filter="other">other</button>
    </div>

    <p class="promise-count" id="promise-count">loading...</p>

    <div class="wall-grid" id="wall-grid">
      <p class="state-msg" id="state-msg">loading the wall...</p>
    </div>

    <div class="write-cta">
      <a href="index.html">make your own promise →</a>
    </div>
  </div>
</div>

<footer>© 2026 · Promises to Self · made with patience and coffee</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPnZ8f4cek3JcIwfopsmxnCAGTXoH--yc",
  authDomain: "typewritertales-5bdda.firebaseapp.com",
  projectId: "typewritertales-5bdda",
  storageBucket: "typewritertales-5bdda.firebasestorage.app",
  messagingSenderId: "631041179526",
  appId: "1:631041179526:web:7d2fea0e3a5b48ce567607"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById('wall-grid');
const msg  = document.getElementById('state-msg');
const countEl = document.getElementById('promise-count');
const filterBar = document.getElementById('filter-bar');

let allPromises = [];

function formatDate(ts) {
  if (!ts) return '';
  const d = ts.toDate();
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function inferCategory(text) {
  const t = text.toLowerCase();
  if (t.includes('gym') || t.includes('run') || t.includes('yoga') || t.includes('meditate') || t.includes('sleep') || t.includes('eat') || t.includes('drink') || t.includes('exercise') || t.includes('workout')) return 'health';
  if (t.includes('read') || t.includes('learn') || t.includes('course') || t.includes('skill') || t.includes('study') || t.includes('practice')) return 'growth';
  if (t.includes('family') || t.includes('friend') || t.includes('call') || t.includes('visit') || t.includes('love') || t.includes('partner') || t.includes('parent')) return 'relationships';
  if (t.includes('job') || t.includes('work') || t.includes('career') || t.includes('project') || t.includes('business') || t.includes('promot')) return 'career';
  return 'other';
}

function renderPromises(filter = 'all') {
  grid.innerHTML = '';
  
  const filtered = filter === 'all' 
    ? allPromises 
    : allPromises.filter(p => p.category === filter);
  
  countEl.textContent = `${filtered.length} promise${filtered.length !== 1 ? 's' : ''}`;
  
  if (filtered.length === 0) {
    msg.textContent = filter === 'all' 
      ? 'nothing here yet. be the first to make a promise.' 
      : `no promises in "${filter}" yet.`;
    grid.appendChild(msg);
    return;
  }
  
  msg.remove();
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'wall-card';
    card.innerHTML = `
      <p class="card-text" style="color:${p.inkColor || '#2c2c2c'}">${escapeHtml(p.text)}</p>
      <div class="card-meta">
        <span>${escapeHtml(p.author || 'anonymous')}</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="card-ribbon" style="background:${p.inkColor || '#2c2c2c'}"></span>
          <span>${formatDate(p.createdAt)}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

async function loadWall() {
  try {
    const q = query(
      collection(db, 'submissions'),
      orderBy('createdAt', 'desc'),
      limit(100)
    );
    const snap = await getDocs(q);
    if (snap.empty) {
      msg.textContent = 'nothing here yet. be the first to make a promise.';
      countEl.textContent = '0 promises';
      return;
    }
    allPromises = snap.docs.map(doc => {
      const d = doc.data();
      return {
        text: d.text,
        author: d.author || 'anonymous',
        inkColor: d.inkColor || '#2c2c2c',
        category: d.category || inferCategory(d.text),
        createdAt: d.createdAt
      };
    });
    msg.remove();
    renderPromises();
  } catch(e) {
    msg.textContent = 'could not load the wall. try again later.';
    countEl.textContent = '';
  }
}

filterBar.addEventListener('click', e => {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderPromises(e.target.dataset.filter);
  }
});

loadWall();
</script>

</body>
</html>
